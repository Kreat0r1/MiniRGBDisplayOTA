<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CryptoCoinDisplay - Spotify Callback</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
    background: #0f1419; color: #e6ebf2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; padding: 20px; text-align: center;
  }
  .sp { width: 44px; height: 44px; border: 4px solid #2d3540; border-top-color: #1db954;
        border-radius: 50%; animation: s 1s linear infinite; margin: 20px; }
  @keyframes s { to { transform: rotate(360deg); } }
  h2 { color: #1db954; margin: 0; }
  p { color: #8b95a3; margin: 6px 0; max-width: 480px; }
  code { background: #2d3540; padding: 2px 6px; border-radius: 4px;
         font-family: ui-monospace, Menlo, Consolas, monospace; color: #e6ebf2; word-break: break-all; }
  a.btn { display: inline-block; background: #1db954; color: #fff;
          padding: 10px 22px; border-radius: 999px; font-weight: 600;
          text-decoration: none; margin-top: 12px; }
  .err { color: #ef4444; }
</style>
</head>
<body>
<h2>Connecting Spotify</h2>
<div class="sp" id="sp"></div>
<p id="msg">Reading callback from Spotify...</p>
<div id="manual" style="display:none">
  <p>Couldn't bounce you back automatically. Open this URL on the same network as your display:</p>
  <p><code id="manualUrl"></code></p>
  <a class="btn" id="goBtn" href="#">Open it</a>
</div>
<script>
  // CryptoCoinDisplay Spotify OAuth bouncer.
  //
  // Spotify requires HTTPS for redirect URIs except for loopback addresses,
  // which makes http://ticker.local/spotify_callback invalid. This static
  // page is the registered redirect URI - it receives the auth code, then
  // navigates the browser back to the customer's local device via plain
  // http://<host>/spotify_callback?code=... so the existing PKCE exchange
  // on the device side completes normally.
  //
  // The customer's device hostname is passed in via the OAuth "state"
  // parameter, set by the dashboard when it builds the authorize URL.
  // No data ever leaves the page (no analytics, no tracking).
  (function () {
    var p = new URLSearchParams(location.search);
    var code = p.get('code');
    var err  = p.get('error');
    var state = p.get('state') || '';
    var msg = document.getElementById('msg');
    var sp  = document.getElementById('sp');

    function showError(text) {
      msg.textContent = text;
      msg.className = 'err';
      sp.style.display = 'none';
    }

    if (err) { showError('Spotify error: ' + err); return; }
    if (!code) { showError('No authorization code in callback.'); return; }

    // The state we expect is just the device's hostname (e.g. "ticker.local"
    // or "192.168.1.50"). Strict-allowlist the characters so a malformed
    // state can't be used to navigate to arbitrary URLs.
    var host = state.replace(/[^a-zA-Z0-9.\-:]/g, '');
    if (!host) {
      showError('Missing or invalid device hostname in state parameter. ' +
                'Re-launch the connect flow from your CryptoCoinDisplay dashboard.');
      return;
    }

    var target = 'http://' + host + '/spotify_callback?code=' + encodeURIComponent(code) +
                 '&state=' + encodeURIComponent(state);

    msg.textContent = 'Returning you to your display...';

    // Show a manual-click fallback in case the auto-navigation gets blocked
    // (some browsers refuse navigation from HTTPS pages to non-loopback HTTP
    // when triggered by script during page load - the user-initiated click
    // version below always works).
    setTimeout(function () {
      document.getElementById('manualUrl').textContent = target;
      var b = document.getElementById('goBtn');
      b.href = target;
      document.getElementById('manual').style.display = 'block';
    }, 1500);

    // Try the automatic redirect first.
    location.href = target;
  })();
</script>
</body>
</html>
